name: feature-pipeline
description: |
  三阶段流水线 (o-spec / o-build / o-review): 从 GitLab 仓库 + 指定分支 +
  需求文档 (DocSpec/ 下文件或文件夹) 自动产出 OpenSpec trio → TDD 实施 →
  终审+自动修复, push 回指定分支. 节点间通过 **远程分支接力** (每节点
  clone → 工作 → commit → push), 全程零人工确认; 失败由 exit_code=2 转人工.

inputs:
  gitlab_url:
    type: str
    required: true
    description: "GitLab clone URL (.git 后缀). 三阶段每节点都用它 clone 当前分支."
  branch:
    type: str
    required: true
    description: |
      开发分支 (用户已先在 GitLab 拉好分支、在 DocSpec/ 放需求、推到远程).
      三阶段都在该分支接力: clone → 工作 → commit → push 回该分支.
  doc_url:
    type: str
    required: true
    description: |
      仓库内需求文档位置 (仅 o-spec 读). 相对路径 / GitLab UI URL;
      文件夹则 glob **/*.md 与 **/*.txt. 找不到 → o-spec exit_code=2.
  figma_token:
    type: str
    required: false
    description: |
      Figma personal access token (仅 o-spec 用). 可选: 文档无 figma 链接
      则留空. 一旦 o-spec 在文档里检出 figma 链接, 此 token 必填且必须有效;
      空 → exit_code=2 figma_link_without_token; 失效 → figma_token_invalid.

output:
  status: $review.status
  exit_code: $review.exit_code
  verdict: $review.verdict
  commit_hash: $review.commit_hash
  pushed_branch: $review.pushed_branch
  blocked_reason: $review.block_reason

model: deepseek-v4.1-flash-1017

nodes:
  - id: spec
    plugin: o-spec
    retry:
      max_attempts: 3
    execution_timeout: 1800
    inputs:
      gitlab_url: $mission.gitlab_url
      branch: $mission.branch
      doc_url: $mission.doc_url
      figma_token: $mission.figma_token?
    model: deepseek-v4.1-flash-1017

  - id: build
    plugin: o-build
    retry:
      max_attempts: 3
    execution_timeout: 3600
    inputs:
      gitlab_url: $mission.gitlab_url
      branch: $mission.branch
    model: deepseek-v4.1-flash-1017

  - id: review
    plugin: o-review
    retry:
      max_attempts: 3
    execution_timeout: 1800
    inputs:
      gitlab_url: $mission.gitlab_url
      branch: $mission.branch
    # 需读 Figma 渲染图（多模态），必须配支持视觉的模型；纯文本模型会 400
    model: deepseek-v4.1-flash-1017

  # 终点判定（deterministic python 节点，零 token）：仅当 review verdict ==
  # pass 时由条件边派发；success 挂在它上面，见 edges 段说明。
  - id: done
    plugin: o-done

edges:
  - from: spec
    to: build
  - from: build
    to: review
  # 无条件边 + 下游自检: 每节点 clone 后若 openspec/<spec_dir>/ 缺失 → exit_code=2,
  # block_reason 指回上游没 push. 条件边用 type: expr + 源节点输出字段裸名（编译期 AST 白名单校验）。
  # 想在 build 失败时跳过 review, 可把第二条边换成:
  #   - from: build
  #     to: review
  #     condition:
  #       type: expr
  #       expr: 'exit_code == 0'
  # needs-rework 反馈环：review 判 needs-rework 时回到 build，
  # o-build 会读 spec_dir/REVIEW.md 的 issues_remaining 逐条重新处理。
  # loop_limit 封顶迭代轮数；耗尽时 human_gate 升级人审而非静默 settle：
  # approve=接受当前产出放行、amend=重置迭代预算再试、reject=节点失败。
  - from: review
    to: build
    condition:
      type: expr
      expr: 'verdict == "needs-rework"'
    loop_limit: 2
    loop_limit_exhausted_action: human_gate
  # 终点判定：仅 review verdict == pass 时派发 done（python 节点，零成本）。
  # success: done —— run 的"目标达成"反映真实审结论。
  - from: review
    to: done
    condition:
      type: expr
      expr: 'verdict == "pass"'

success: done
